name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  check-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI Jobs
        shell: bash
        run: |
          echo "Waiting for CI checks (Lint, Format, Commit Lint) to complete..."
          # We disable 'set -e' locally so that the script doesn't exit when grep finds no matches
          set +e
          while true; do
            # Fetch statuses for specific CI jobs, matching both direct and prefixed names
            STATUSES=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
              --jq '.check_runs[] | select(.name | test("^(Lint|Format|Commit Lint|CI Pipeline / (Lint|Format|Commit Lint))$"; "i")) | .conclusion' 2>/dev/null)
            
            # Exit if any CI job failed
            if echo "$STATUSES" | grep -q "failure"; then
              echo "❌ One or more CI checks failed. Aborting CD Pipeline."
              exit 1
            fi

            # Count completed checks safely
            COMPLETED_COUNT=$(echo "$STATUSES" | grep -E "success|skipped" | wc -l)
            
            if [[ $COMPLETED_COUNT -ge 3 ]]; then
              echo "✅ All CI checks passed ($COMPLETED_COUNT checks found)."
              exit 0
            fi

            # Format statuses for display
            DISPLAY_STATUSES=$(echo "$STATUSES" | tr '\n' ' ' | sed 's/ $//')
            if [ -z "$DISPLAY_STATUSES" ]; then DISPLAY_STATUSES="pending/queued"; fi
            
            echo "🕒 Still waiting... (Current statuses: $DISPLAY_STATUSES)"
            sleep 20
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build & Push Docker Image
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/audify-ejs:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/audify-ejs:latest
          cache-to: type=inline
          provenance: false

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~
            chmod +x update-audify.sh
            ./update-audify.sh
